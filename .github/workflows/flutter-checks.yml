name: Flutter checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Validate bootstrap scripts
        run: bash -n ../scripts/*.sh
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  ios-build:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Confirm Xcode and CocoaPods
        run: |
          xcodebuild -version
          pod --version
      - name: Install pinned Pikafish and NNUE
        run: ../scripts/bootstrap.sh
      - run: flutter pub get
      - name: Compile iOS simulator app
        run: flutter build ios --simulator --no-codesign
      - name: Verify iOS simulator FFI symbols
        run: |
          APP_BINARY=build/ios/iphonesimulator/Runner.app/Runner
          for symbol in pikafish_init pikafish_main pikafish_stdin_write pikafish_stdout_read; do
            nm -gU "$APP_BINARY" | grep -q " _$symbol$"
          done
      - name: Compile iPhone app without signing
        run: flutter build ios --release --no-codesign
      - name: Verify iPhone FFI symbols
        run: |
          APP_BINARY=build/ios/iphoneos/Runner.app/Runner
          for symbol in pikafish_init pikafish_main pikafish_stdin_write pikafish_stdout_read; do
            nm -gU "$APP_BINARY" | grep -q " _$symbol$"
          done
      - name: Package unsigned IPA for Windows sideloading
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p build/ios/ipa/Payload
          ditto build/ios/iphoneos/Runner.app build/ios/ipa/Payload/Runner.app
          (cd build/ios/ipa && ditto -c -k --keepParent Payload PikaCoach-unsigned.ipa)
          unzip -tq build/ios/ipa/PikaCoach-unsigned.ipa
          test -s build/ios/ipa/PikaCoach-unsigned.ipa
          du -h build/ios/ipa/PikaCoach-unsigned.ipa
      - name: Upload unsigned IPA for Windows
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: PikaCoach-unsigned-iPhone
          path: app/build/ios/ipa/PikaCoach-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
