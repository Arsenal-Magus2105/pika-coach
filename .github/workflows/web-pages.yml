name: Publish Pika Coach web

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/web-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cd web && npm test
      - run: bash web/scripts/fetch_engine.sh
      - run: node web/scripts/engine-smoke.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web/

  deploy:
    if: github.event.repository.private == false
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
