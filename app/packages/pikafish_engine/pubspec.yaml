name: pikafish_engine
description: In-process Pikafish bridge used by Pika Coach on iOS.
version: 0.1.0
repository: https://github.com/Arsenal-Magus2105/pika-coach

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  ffi: ^2.1.3
  flutter:
    sdk: flutter
  logging: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: PikafishPlugin
